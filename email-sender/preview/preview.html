<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okiza Email Templates — Interactive Suite & Live Preview</title>
  <style>
    /* Complete invisible scrollbar system - hides scrollbars on all browsers */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }

    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* TOP HEADER */
    header {
      background-color: #0d0d11;
      border-bottom: 1px solid #232328;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo-container {
      width: 36px;
      height: 36px;
      background-color: #050507;
      border: 1px solid #272730;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 16px rgba(255,255,255,0.06);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .brand-logo-container:hover {
      transform: scale(1.08);
      border-color: #ffffff;
    }
    .brand-logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
    }
    .badge-sub {
      background-color: #17171d;
      border: 1px solid #272732;
      color: #d4d4d8;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 9999px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulseAnim 2s infinite ease-in-out;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .device-buttons {
      display: flex;
      background-color: #141418;
      border: 1px solid #24242c;
      border-radius: 8px;
      padding: 3px;
    }
    .device-btn {
      background: transparent;
      border: none;
      color: #a1a1aa;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .device-btn.active {
      background-color: #ffffff;
      color: #000000;
      font-weight: 600;
    }
    .copy-btn {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .copy-btn:hover {
      background-color: #e4e4e7;
    }

    /* MAIN WORKSPACE */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* SIDEBAR - TEMPLATES & EDITORS */
    aside {
      width: 380px;
      background-color: #0d0d10;
      border-right: 1px solid #24242c;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: scroll;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .sidebar-section {
      padding: 16px 20px;
      border-bottom: 1px solid #24242c;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #71717a;
      margin-bottom: 12px;
    }
    .template-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .template-card {
      padding: 10px 14px;
      border-radius: 8px;
      background-color: #141418;
      border: 1px solid #24242c;
      color: #d4d4d8;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .template-card:hover {
      background-color: #1c1c24;
      border-color: #3b3b48;
      color: #ffffff;
    }
    .template-card.active {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
      font-weight: 600;
    }
    .template-card.active .tag {
      background-color: #000000;
      color: #ffffff;
    }
    .tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: #27272a;
      color: #a1a1aa;
    }

    /* FORM INPUTS */
    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #a1a1aa;
      margin-bottom: 5px;
    }
    .form-input, .form-textarea {
      width: 100%;
      background-color: #141418;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      color: #ffffff;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .form-input:focus, .form-textarea:focus {
      border-color: #ffffff;
    }
    .form-textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.4;
    }

    /* PREVIEW VIEWPORT AREA */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #050507;
      overflow: hidden;
      position: relative;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .view-tabs {
      background-color: #0d0d10;
      border-bottom: 1px solid #24242c;
      display: flex;
      padding: 0 20px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 12px 16px;
      color: #a1a1aa;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .tab-btn.active {
      color: #ffffff;
      border-bottom-color: #ffffff;
      font-weight: 600;
    }
    .preview-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-y: scroll;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .iframe-wrapper {
      background-color: #050507;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      transition: width 0.25s ease, height 0.25s ease;
      overflow: hidden;
      border: 1px solid #26262b;
      height: 100%;
      max-height: 850px;
      display: flex;
    }
    .iframe-wrapper.desktop { width: 680px; }
    .iframe-wrapper.tablet { width: 768px; }
    .iframe-wrapper.mobile { width: 385px; }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #050507;
      overflow-y: scroll;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* CODE PREVIEW */
    .code-stage {
      display: none;
      flex: 1;
      padding: 20px;
      overflow-y: scroll;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    pre {
      background-color: #0d0d10;
      border: 1px solid #26262a;
      border-radius: 8px;
      padding: 16px;
      color: #e4e4e7;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: #ffffff;
      color: #000000;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

    let currentTemplateKey = 'founder-message';
    let currentFormData = {};

    function init() {
      renderTemplateList();
      selectTemplate(currentTemplateKey);
    }

    function renderTemplateList() {
      const container = document.getElementById('templateList');
      container.innerHTML = '';
      
      for (const [key, item] of Object.entries(previewData)) {
        const btn = document.createElement('button');
        btn.className = 'template-card' + (key === currentTemplateKey ? ' active' : '');
        btn.id = 'btn-' + key;
        btn.onclick = () => selectTemplate(key);
        
        const isLight = key.includes('light');
        const isFounder = key.includes('founder');
        btn.innerHTML = `
          <span>${item.name}</span>
          <span class="tag">${isFounder ? 'Executive' : isLight ? 'Light' : 'Dark'}</span>
        `;
        container.appendChild(btn);
      }
    }

    function selectTemplate(key) {
      currentTemplateKey = key;
      document.querySelectorAll('.template-card').forEach(c => c.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + key);
      if (activeBtn) activeBtn.classList.add('active');

      currentFormData = { ...previewData[key].data };
      renderFormFields();
      updatePreview();
    }

    function renderFormFields() {
      const container = document.getElementById('fieldsContainer');
      container.innerHTML = '';

      for (const [prop, val] of Object.entries(currentFormData)) {
        const group = document.createElement('div');
        group.className = 'form-group';

        const label = document.createElement('label');
        label.className = 'form-label';
        label.textContent = '{{' + prop + '}}';

        let input;
        if (prop === 'message' || prop === 'founderNote') {
          input = document.createElement('textarea');
          input.className = 'form-textarea';
          input.value = val;
        } else {
          input = document.createElement('input');
          input.type = 'text';
          input.className = 'form-input';
          input.value = val;
        }

        input.oninput = (e) => {
          currentFormData[prop] = e.target.value;
          updatePreview();
        };

        group.appendChild(label);
        group.appendChild(input);
        container.appendChild(group);
      }
    }

    function getRenderedHtml() {
      let rawHtml = rawTemplates[currentTemplateKey] || '';
      
      // Interpolate placeholders
      let rendered = rawHtml.replace(/\{\{([a-zA-Z0-9_]+)\}\}/g, (match, key) => {
        if (key in currentFormData) {
          return currentFormData[key];
        }
        return match;
      });

      // Replace /assets/logo-animated.gif with base64 for smooth rendering inside preview iframe
      rendered = rendered.replace(/\/assets\/logo-animated\.gif/g, animatedGifData);

      return rendered;
    }

    function updatePreview() {
      const rendered = getRenderedHtml();
      
      // Update iframe
      const frame = document.getElementById('previewFrame');
      const doc = frame.contentDocument || frame.contentWindow.document;
      doc.open();
      doc.write(rendered);
      doc.close();

      // Inject clean scrollbar-hiding rules into the iframe
      try {
        const style = doc.createElement('style');
        style.textContent = '* { -ms-overflow-style: none !important; scrollbar-width: none !important; } *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }';
        doc.head.appendChild(style);
      } catch (err) {}

      // Update code viewer
      document.getElementById('codeViewer').textContent = rendered;
    }

    function setDevice(type) {
      document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      const wrapper = document.getElementById('iframeWrapper');
      wrapper.className = 'iframe-wrapper ' + type;
    }

    function switchView(view) {
      document.getElementById('tabPreview').classList.toggle('active', view === 'preview');
      document.getElementById('tabCode').classList.toggle('active', view === 'code');

      document.getElementById('previewStage').style.display = view === 'preview' ? 'flex' : 'none';
      document.getElementById('codeStage').style.display = view === 'code' ? 'block' : 'none';
    }

    function copyRenderedHtml() {
      const rendered = getRenderedHtml();
      navigator.clipboard.writeText(rendered).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    window.onload = init;
  </script>
</body>
